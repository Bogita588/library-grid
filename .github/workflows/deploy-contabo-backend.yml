name: Deploy Contabo Backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.CONTABO_SSH_KEY }}" > ~/.ssh/contabo
          chmod 600 ~/.ssh/contabo
          ssh-keyscan -H "${{ secrets.CONTABO_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync backend source
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/contabo" \
            --exclude='.git/' \
            --exclude='node_modules/' \
            --exclude='.output/' \
            --exclude='dist/' \
            --exclude='.env' \
            ./ "${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}:/opt/pleng-dms/"

      - name: Apply PostgreSQL schema
        run: |
          ssh -i ~/.ssh/contabo "${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}" <<'REMOTE'
          set -euo pipefail
          cd /opt/pleng-dms
          DATABASE_URL="$(grep -E '^DATABASE_URL=' .env | tail -1 | cut -d= -f2-)"
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL is missing in /opt/pleng-dms/.env" >&2
            exit 1
          fi
          for file in db/postgres/*.sql; do
            psql "$DATABASE_URL" -f "$file"
          done
          REMOTE

      - name: Ensure document preview tools
        run: |
          ssh -i ~/.ssh/contabo "${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}" <<'REMOTE'
          set -euo pipefail
          if command -v libreoffice >/dev/null 2>&1 && command -v gs >/dev/null 2>&1; then
            exit 0
          fi
          if command -v sudo >/dev/null 2>&1; then
            SUDO=sudo
          else
            SUDO=
          fi
          $SUDO apt-get update
          DEBIAN_FRONTEND=noninteractive $SUDO apt-get install -y --no-install-recommends \
            libreoffice-writer \
            libreoffice-calc \
            libreoffice-impress \
            ghostscript \
            fonts-dejavu \
            fonts-liberation \
            fonts-noto-core
          REMOTE

      - name: Build and restart backend
        run: |
          ssh -i ~/.ssh/contabo "${{ secrets.CONTABO_USER }}@${{ secrets.CONTABO_HOST }}" <<'REMOTE'
          set -euo pipefail
          cd /opt/pleng-dms
          npm install --package-lock=false
          npm run build
          systemctl restart pleng-dms
          systemctl --no-pager --full status pleng-dms | sed -n '1,16p'
          REMOTE

      - name: Check backend health
        run: |
          curl --fail --show-error --silent "http://${{ secrets.CONTABO_HOST }}:3001/api/health"
